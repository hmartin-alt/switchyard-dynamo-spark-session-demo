apiVersion: batch/v1
kind: Job
metadata:
  name: prefetch-models
  namespace: dynamo
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        workload: model-serving
      volumes:
      - name: hf-cache
        hostPath:
          path: /opt/hf-cache
          type: DirectoryOrCreate
      containers:
      - name: prefetch
        image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0
        securityContext:
          runAsUser: 0
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          mkdir -p /hf-cache/hub
          echo "Downloading google/gemma-4-E4B-it..."
          python3 -c "
          from huggingface_hub import snapshot_download
          path = snapshot_download(
              repo_id='google/gemma-4-E4B-it',
              cache_dir='/hf-cache/hub')
          print(f'gemma-4-E4B-it done: {path}')
          "
          echo "Downloading google/gemma-4-31B-it..."
          python3 -c "
          from huggingface_hub import snapshot_download
          path = snapshot_download(
              repo_id='google/gemma-4-31B-it',
              cache_dir='/hf-cache/hub')
          print(f'gemma-4-31B-it done: {path}')
          "
          echo "All models downloaded."
        envFrom:
        - secretRef:
            name: hf-token-secret
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token-secret
              key: HUGGING_FACE_HUB_TOKEN
        - name: HF_HOME
          value: /hf-cache
        - name: HF_HUB_CACHE
          value: /hf-cache/hub
        volumeMounts:
        - name: hf-cache
          mountPath: /hf-cache
        resources:
          requests:
            memory: "8Gi"
            cpu: "2"
