schema_version = 1

[llm_clients.efficient]
format = "openai_chat"
base_url = "http://efficient-frontend.dynamo.svc.cluster.local:8000/v1"
api_key_env = "DUMMY_KEY"

[llm_clients.capable]
format = "openai_chat"
base_url = "http://capable-frontend.dynamo.svc.cluster.local:8000/v1"
api_key_env = "DUMMY_KEY"

[targets.weak]
id = "efficient"
llm_client = "efficient"
omit_body_fields = ["model"]
extra_body = { model = "efficient", temperature = 0.0, seed = 42 }

[targets.strong]
id = "capable"
llm_client = "capable"
omit_body_fields = ["model"]
extra_body = { model = "capable", temperature = 0.0, seed = 42 }

[routes.shopping]
id = "shopping"
type = "prefill_router"
targets = ["weak", "strong"]
checkpoint = "/router-runtime/prefill_router.pt"
device = "cuda"
max_length = 2048
batch_size = 16
tolerance = 0.1760250329971314
