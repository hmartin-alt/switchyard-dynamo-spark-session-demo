apiVersion: v1
kind: Pod
metadata:
  name: switchyard-colocated-builder
  namespace: dynamo
spec:
  restartPolicy: Never
  nodeSelector:
    workload: model-serving
  containers:
  - name: builder
    # Build against the exact Python/CUDA runtime used by the Dynamo worker.
    image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0
    command: ["sleep", "infinity"]
    securityContext:
      runAsUser: 0
    resources:
      requests:
        cpu: "8"
        memory: 16Gi
      limits:
        memory: 32Gi
    volumeMounts:
    - name: runtime
      mountPath: /runtime
  volumes:
  - name: runtime
    hostPath:
      path: /opt/switchyard-colocated
      type: DirectoryOrCreate
