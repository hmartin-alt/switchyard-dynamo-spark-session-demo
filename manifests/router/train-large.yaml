apiVersion: v1
kind: Pod
metadata:
  name: router-train-large
  namespace: dynamo
spec:
  restartPolicy: Never
  nodeSelector:
    workload: model-serving
  containers:
  - name: trainer
    image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0
    command: ["sleep", "infinity"]
    securityContext:
      runAsUser: 0
    envFrom:
    - secretRef:
        name: hf-token-secret
    env:
    - name: HF_HOME
      value: /hf-cache
    - name: HF_HUB_CACHE
      value: /hf-cache/hub
    resources:
      requests:
        cpu: "8"
        memory: 32Gi
      limits:
        nvidia.com/gpu: "1"
        memory: 64Gi
    volumeMounts:
    - name: runtime
      mountPath: /router-runtime
    - name: hf-cache
      mountPath: /hf-cache
    - name: shm
      mountPath: /dev/shm
  volumes:
  - name: runtime
    hostPath:
      path: /opt/switchyard-colocated
      type: DirectoryOrCreate
  - name: hf-cache
    hostPath:
      path: /opt/hf-cache
      type: DirectoryOrCreate
  - name: shm
    emptyDir:
      medium: Memory
      sizeLimit: 8Gi
