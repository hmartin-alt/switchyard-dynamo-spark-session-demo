routing:
  method: prefill
  encoder: Qwen/Qwen3.5-0.8B
  encoder_backend: transformers
  tolerance: 0.0
models:
  - name: efficient
    litellm_model: openai/efficient
    api_base: http://localhost:18000/v1
    cost_per_m_input_tokens: 0.0
    cost_per_m_output_tokens: 0.0
  - name: capable
    litellm_model: openai/capable
    api_base: http://localhost:18001/v1
    cost_per_m_input_tokens: 0.0
    cost_per_m_output_tokens: 0.0
# Training config; prices are supplied separately to the validation sweep.
# Deployment policy is in manifests/router/colocated-routes.toml.
